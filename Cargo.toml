[package]
name = "notebook-tui"
version = "0.1.0"
edition = "2024"
description = "A terminal editor for Jupyter notebooks"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
pulldown-cmark = "0.13"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde_json = "1"
tempfile = "3"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

